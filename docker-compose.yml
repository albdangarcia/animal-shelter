services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mysecretpassword}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 2s
  nextjs:
    env_file:
      - .env
    environment:
      # Win over env_file and point at the postgres service name — the .env
      # values are for host-run `npm run dev`, where 127.0.0.1 means the
      # host, not this container's neighbour.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-mysecretpassword}@postgres:5432/${POSTGRES_DB:-postgres}
      DATABASE_URL_UNPOOLED: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-mysecretpassword}@postgres:5432/${POSTGRES_DB:-postgres}
      NEXT_TELEMETRY_DISABLED: "1"
    build:
        context: .
        # Used while building the docker image for Prisma generation etc.
        args:
          - DATABASE_URL=${DATABASE_URL}
          - DATABASE_URL_UNPOOLED=${DATABASE_URL_UNPOOLED}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
