name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR cancels the run it superseded instead of queueing behind it.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # This name is the required-status-check key in the `main` ruleset.
    # Renaming it silently stops the check reporting and blocks every PR.
    name: checks
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts resolves the datasource eagerly at module load, so the
      # postinstall `prisma generate` throws without this even though nothing
      # here touches a database. Never connected to.
      DATABASE_URL_UNPOOLED: postgresql://placeholder:placeholder@127.0.0.1:5432/placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  # Nothing else in CI exercises the migration files: the e2e harness builds its
  # schema with `prisma db push`, while Vercel's build runs `prisma migrate
  # deploy`. So a schema.prisma change committed without a generated migration
  # passes every other check and only fails at deploy time. This job closes that
  # gap — no seed, no browsers, no compose file, so it reports in under a minute.
  migrations:
    # This name is the required-status-check key in the `main` ruleset.
    # Renaming it silently stops the check reporting and blocks every PR.
    name: migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # `direct` mode, which is what migrations require — prisma.config.ts calls
      # resolveDatabaseUrl("direct"), and that reads this variable.
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Replays every migration into an empty database. Fails if any of them is
      # broken or out of order — the thing Vercel would otherwise discover first.
      - name: Apply migrations from zero
        run: npx prisma migrate deploy

      # Then compares that materialized result against schema.prisma. Exit code 2
      # means they disagree, i.e. the schema was edited without a migration being
      # generated. No shadow database is needed because `migrate deploy` above
      # already materialized the migrations into a real one.
      - name: Check migrations match schema.prisma
        run: |
          npx prisma migrate diff \
            --from-config-datasource \
            --to-schema=./prisma/schema.prisma \
            --exit-code

  # The prisma/**/*.test.ts tests need a real Postgres but no browser, seed or
  # app server, so they run here in parallel with e2e instead of ahead of it.
  # They read no secrets, so unlike e2e this job also runs on fork PRs.
  db-tests:
    # This name is the required-status-check key in the `main` ruleset.
    # Renaming it silently stops the check reporting and blocks every PR.
    name: db-tests
    runs-on: ubuntu-latest
    env:
      # resolveDatabaseUrl() gives this priority in both pooled and direct
      # modes. It is the e2e container's URL, not test:db's (55600 locally):
      # this job has its own VM, so the two cannot collide here.
      PLAYWRIGHT_DATABASE_URL: postgresql://postgres:mysecretpassword@127.0.0.1:55432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # `npm run test:db` (scripts/test-db.ts) does these three steps against
      # its own compose project and port; CI keeps them as explicit steps so
      # a failure points at the stage that broke and the container is managed
      # as its own step.
      - name: Start throwaway Postgres
        run: docker compose -p animal-shelter-playwright -f docker-compose.playwright.yml up -d --wait
      - name: Push schema
        run: npx prisma db push
      - name: Prisma DB tests
        run: npx tsx --test "prisma/**/*.test.ts"

  # The browser suite, split into four shards that each run on their own VM, so
  # global-setup's fixed container name, port and compose project never
  # collide. Playwright hands out whole files in path order, balanced by test
  # count. Not a required check itself: the `e2e` job below reports for all
  # four, so the shard count can change without touching the ruleset.
  e2e-shard:
    name: e2e-shard (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      # Let every shard finish, so one run shows every failing spec.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Public repo: secrets are withheld from fork PRs, so skip rather than fail.
    # Keep this identical to the `e2e` job's condition below.
    if: github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    env:
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      # resolveDatabaseUrl() gives this priority in both pooled and direct
      # modes, and it matches what playwright/env.ts computes on its own.
      PLAYWRIGHT_DATABASE_URL: postgresql://postgres:mysecretpassword@127.0.0.1:55432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright (browser + system deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright system deps (browser cached)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # global-setup brings up the throwaway Postgres itself, drops its schema,
      # pushes and seeds, so no database step is needed before this one.
      - name: Playwright e2e
        run: npm run e2e -- --shard=${{ matrix.shard }}/4

      # One artifact per shard: upload-artifact@v4 refuses a second upload
      # under a name already used in the run.
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e:
    # This name is the required-status-check key in the `main` ruleset.
    # Renaming it silently stops the check reporting and blocks every PR.
    # It reports the shards' combined result under the name the ruleset knows.
    name: e2e
    needs: [e2e-shard]
    runs-on: ubuntu-latest
    # `always()` because a skipped required check counts as passing: without it
    # a failed or cancelled shard would skip this job and let a red run merge.
    # Not `!cancelled()` either, which skips this job when the run is cancelled.
    # The fork condition is the shards' own, so on fork PRs this job is skipped
    # exactly as the shards are; if the two drift apart, fork PRs are either
    # blocked forever or merged without running the suite.
    if: always() && (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      # One result for the whole matrix: `success` only if every shard passed.
      # `failure`, `cancelled` and `skipped` all fail this step.
      - run: test "${{ needs.e2e-shard.result }}" = "success"
